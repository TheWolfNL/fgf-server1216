<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dominion Warzone Guide</title>
  <meta name="description" content="Daily scoring guide for the Foundation: Galactic Frontier Dominion Warzone event.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <div id="alert-banner" class="alert-banner" hidden></div>

    <header class="hero">
      <p class="event-subtitle">Foundation: Galactic Frontier</p>
      <h1 class="event-title">Dominion Warzone</h1>
      <p class="event-subtitle">Server vs. server scoring guide — updated each day of the event</p>
      <div class="tz-banner">
        <span id="tz-info"></span>
        <span>Next reset in <span id="reset-countdown" class="reset-countdown">--:--:--</span></span>
      </div>
    </header>

    <nav class="day-nav" id="day-nav" aria-label="Event day selector"></nav>

    <main id="day-content"></main>

    <footer class="site-footer">
      <p>Community-made guide, not affiliated with the developers of Foundation: Galactic Frontier.</p>
      <p class="site-footer-credit">Created with love, by the PervSquad.</p>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
